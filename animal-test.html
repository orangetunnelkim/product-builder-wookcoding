<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인공지능 동물상 테스트</title>
  <link href='animal-test.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    
    <header>
      <h1>인공지능 동물상 테스트</h1>
      <p class="subtitle">나와 닮은 동물은 무엇일까요?</p>
    </header>

    <main>
      <div style="margin-bottom: 2rem;">
        <a href="index.html" style="text-decoration: none; color: #ff6b6b; font-weight: 600;">← 로또 번호 생성기로 돌아가기</a>
      </div>
      
      <!-- Upload Mode Only -->
      <div id="upload-section">
        <div id="upload-area" class="upload-area">
          <div class="upload-icon">📸</div>
          <p>사진을 드래그하거나 클릭하여 업로드하세요</p>
          <input type="file" id="image-upload" accept="image/*" hidden>
        </div>
      </div>

      <!-- Result Display -->
      <div id="result-area" class="result-area" style="display: none;">
        <div class="preview-container">
          <img id="face-image" src="" alt="Face Image">
        </div>
        <p id="loading-message" style="display: none;">분석 중...</p>
        <div id="label-container" class="label-container"></div>
        <button id="retry-btn" class="retry-btn">다시 하기</button>
      </div>
    </main>

    <div class="partnership-section">
      <hr>
      <h2>제휴 문의</h2>
      <form action="https://formspree.io/f/xgodvvnv" method="POST" id="partnership-form">
        <div class="form-group">
          <label for="name">성함/업체명</label>
          <input type="text" id="name" name="name" required placeholder="예: 홍길동 / 길동컴퍼니">
        </div>
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label for="message">문의 내용</label>
          <textarea id="message" name="message" required placeholder="제휴 관련 내용을 입력해주세요."></textarea>
        </div>
        <button type="submit" id="submit-btn">보내기</button>
      </form>
    </div>

    <div class="comments-section">
      <hr>
      <div id="disqus_thread"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script defer type="text/javascript" src="animal-test.js"></script>
  
  <script>
      (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://productbuilder-myjgdia0g9.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
      })();
  </script>
</body>
</html>
