<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 생성기</title>
  <link href='style.css' rel='stylesheet'>
  <style>
    .nav-btn {
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s;
    }
    .nav-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <h1>로또 번호 생성기</h1>
    <div class="lotto-numbers">
      <span class="number">?</span>
      <span class="number">?</span>
      <span class="number">?</span>
      <span class="number">?</span>
      <span class="number">?</span>
      <span class="number">?</span>
    </div>
    <button id="generate-btn">번호 생성하기</button>
    
    <div style="margin-top: 2rem;">
      <p>다른 테스트도 해보시겠어요?</p>
      <a href="animal-test.html" class="nav-btn">인공지능 동물상 테스트 가기 🐶</a>
    </div>

    <div class="partnership-section">
      <hr>
      <h2>제휴 문의</h2>
      <form action="https://formspree.io/f/xgodvvnv" method="POST" id="partnership-form">
        <div class="form-group">
          <label for="name">성함/업체명</label>
          <input type="text" id="name" name="name" required placeholder="예: 홍길동 / 길동컴퍼니">
        </div>
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label for="message">문의 내용</label>
          <textarea id="message" name="message" required placeholder="제휴 관련 내용을 입력해주세요."></textarea>
        </div>
        <button type="submit" id="submit-btn">보내기</button>
      </form>
    </div>

    <div class="comments-section">
      <hr>
      <div id="disqus_thread"></div>
    </div>
  </div>
  <script defer type="text/javascript" src="lotto.js"></script>
  <script>
      (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://productbuilder-myjgdia0g9.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
      })();
  </script>
</body>
</html>
